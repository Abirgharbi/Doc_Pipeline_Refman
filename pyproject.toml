[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "doc-pipeline"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "docling>=2.0.0",
    "Pillow>=10.0.0",
    "ollama>=0.2.0",
    "openai>=1.35.0",
    "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["doc_pipeline*"]
